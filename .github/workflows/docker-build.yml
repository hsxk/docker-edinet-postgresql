name: Docker Build

on:
  push:
    branches: [main]
    tags: ['v*.*.*']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: edinet-postgresql-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

env:
  IMAGE: hsxk/edinet-postgresql

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Build validation image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: Dockerfile
          load: true
          push: false
          tags: edinet-postgresql:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Verify PostgreSQL, PostGIS and pg_trgm
        shell: bash
        run: |
          set -euo pipefail
          cid=$(docker run -d --rm             -e POSTGRES_PASSWORD=test-password             -e POSTGRES_DB=edinet_test             edinet-postgresql:ci)
          trap 'docker stop "$cid" >/dev/null 2>&1 || true' EXIT

          for i in {1..30}; do
            if docker exec "$cid" pg_isready -U postgres -d edinet_test >/dev/null 2>&1; then
              break
            fi
            sleep 1
          done

          docker exec "$cid" pg_isready -U postgres -d edinet_test
          docker exec "$cid" psql -v ON_ERROR_STOP=1 -U postgres -d edinet_test -c 'CREATE EXTENSION IF NOT EXISTS postgis;'
          docker exec "$cid" psql -v ON_ERROR_STOP=1 -U postgres -d edinet_test -c 'CREATE EXTENSION IF NOT EXISTS pg_trgm;'
          docker exec "$cid" psql -At -U postgres -d edinet_test -c "SELECT extname FROM pg_extension WHERE extname IN ('postgis','pg_trgm') ORDER BY extname;"             | grep -Fx postgis
          docker exec "$cid" psql -At -U postgres -d edinet_test -c "SELECT extname FROM pg_extension WHERE extname IN ('postgis','pg_trgm') ORDER BY extname;"             | grep -Fx pg_trgm

      - name: Trivy OS vulnerability gate
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: edinet-postgresql:ci
          format: table
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          vuln-type: os
          exit-code: '1'

      # The official postgres:17 image currently includes gosu built with an
      # older Go toolchain. Keep those language-binary findings visible without
      # misclassifying them as Debian package regressions owned by this image.
      - name: Trivy full dependency report
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: edinet-postgresql:ci
          format: table
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          vuln-type: os,library
          exit-code: '0'

  publish:
    if: github.event_name == 'push'
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up QEMU
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to Docker Hub
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}
            type=sha
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}

      - name: Build and push multi-arch image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: Dockerfile
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: mode=max
          sbom: true
